<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三国杀 · Web 客户端</title>
  <style>
    :root {
      --bg: #1c2230; --panel: #252c3d; --card: #f4ecd8; --ink: #2b2b2b;
      --red: #c0392b; --blue: #2e6fb0; --gold: #d4af37; --green: #27ae60;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: #e8e8e8; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    header { padding: 10px 16px; background: #141927; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    header input { padding: 6px 8px; border-radius: 6px; border: 1px solid #3a4258; }
    input, select { background: #2c3446; color: #eee; border: 1px solid #404a63; padding: 6px 8px; border-radius: 6px; }
    button { cursor: pointer; border: none; border-radius: 6px; padding: 7px 12px; background: #3a64a8; color: #fff; font-size: 13px; }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.danger { background: #8e3b3b; }
    button.gold { background: var(--gold); color: #333; }
    button.green { background: var(--green); }
    #app { padding: 12px; max-width: 1100px; margin: 0 auto; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .seats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
    .seat { background: var(--panel); border-radius: 10px; padding: 10px; position: relative; border: 2px solid transparent; }
    .seat.current { border-color: var(--gold); box-shadow: 0 0 14px rgba(212,175,55,.5); }
    .seat.dead { opacity: 0.45; }
    .seat .name { font-weight: 700; }
    .seat .meta { font-size: 12px; color: #aab; margin: 4px 0; }
    .seat .hp { color: var(--red); font-weight: 700; }
    .seat .iden { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #445; }
    .seat .iden.lord { background: var(--gold); color:#333; }
    .seat .iden.loyalist { background: var(--blue); }
    .seat .iden.rebel { background: var(--red); }
    .seat .iden.spy { background: #6c5; }
    .seat .judge { font-size: 11px; color: var(--gold); }
    .seat .hero { font-size: 12px; color: #cdd; }
    .seat.clickable { cursor: pointer; }
    .seat.clickable:hover { border-color: var(--green); }
    .hand { display: flex; gap: 8px; flex-wrap: wrap; min-height: 110px; margin-top: 8px; }
    .card { width: 74px; height: 102px; background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px; position: relative; border: 2px solid transparent; user-select: none; }
    .card:hover { transform: translateY(-6px); }
    .card.selected { border-color: var(--red); transform: translateY(-10px); }
    .card .cn { position: absolute; top: 4px; left: 6px; font-weight: 700; font-size: 13px; }
    .card .num { position: absolute; bottom: 4px; right: 6px; font-weight: 700; font-size: 14px; }
    .card .suit { position: absolute; top: 22px; left: 6px; font-size: 18px; }
    .card.trick { background: #e7d9b8; }
    .card.equip { background: #d9e7d9; }
    .card .tag { position:absolute; bottom:4px; left:6px; font-size:10px; color:#777; }
    .panel { background: var(--panel); border-radius: 10px; padding: 10px; }
    .logs { max-height: 180px; overflow: auto; font-size: 12px; line-height: 1.6; color: #bcd; }
    .logs .ev { border-bottom: 1px dashed #33405a; padding: 2px 0; }
    .actions { margin: 10px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .hint { color: var(--gold); font-size: 13px; min-height: 18px; }
    .hidden { display: none; }
    .win { font-size: 26px; font-weight: 800; color: var(--gold); text-align: center; margin: 20px 0; }
    .pill { font-size: 11px; padding: 1px 6px; border-radius: 10px; background:#3a4258; }
  </style>
</head>
<body>
  <header>
    <strong>三国杀</strong>
    <input id="server" value="http://localhost:3000" style="width:200px" placeholder="服务端地址" />
    <button id="guestBtn">游客登录并连接</button>
    <span id="connState" class="pill">未连接</span>
    <span id="tenantWrap" style="display:none">租户<input id="tenant" value="default" style="width:90px" /></span>
  </header>

  <div id="app">
    <!-- 大厅 -->
    <div id="lobby" class="panel">
      <div class="row">
        <button id="createAiBtn">创建 AI 房</button>
        <button id="createNetBtn">创建联网房</button>
        <input id="joinId" placeholder="房间号" style="width:120px" />
        <button id="joinBtn">加入</button>
        <span id="myRoom" class="hint"></span>
      </div>
      <div class="actions">
        <button id="startBtn" class="green hidden">开始游戏</button>
        <button id="leaveBtn" class="danger hidden">离开房间</button>
        <button id="historyBtn">查看战绩</button>
      </div>
      <div id="history" class="logs hidden"></div>
    </div>

    <!-- 对局 -->
    <div id="game" class="hidden">
      <div class="hint" id="gameHint"></div>
      <div class="seats" id="seats"></div>

      <div class="panel">
        <div class="actions">
          <span class="hint" id="turnInfo"></span>
          <button id="playBtn" class="green" disabled>出牌</button>
          <button id="endBtn">结束回合</button>
          <span id="skillBtns"></span>
          <span id="respondBtns"></span>
        </div>
        <div class="hand" id="hand"></div>
      </div>

      <div class="panel" style="margin-top:12px">
        <strong>战报</strong>
        <div class="logs" id="logs"></div>
      </div>

      <div id="result" class="win hidden"></div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    let socket = null;
    let token = '';
    let view = null;            // 当前 ClientGameView
    let selectedCards = [];     // 选中的手牌 id
    let pendingTarget = null;   // 当前需要选择的目标座位
    const SUIT_SYMBOL = { spade: '♠', heart: '♥', club: '♣', diamond: '♦' };
    const SUIT_COLOR = { spade: '#222', heart: '#c0392b', club: '#222', diamond: '#c0392b' };

    function setConn(s) { $('connState').textContent = s; }
    function api(path, body) {
      return fetch($('server').value + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      }).then((r) => r.json());
    }

    async function guestLogin() {
      try {
        const res = await api('/api/client/v1/auth/guest', {});
        token = res.token || (res.data && res.data.token) || '';
        if (!token) { alert('获取 token 失败：' + JSON.stringify(res)); return false; }
        return true;
      } catch (e) { alert('登录请求失败：' + e.message); return false; }
    }

    function connect() {
      const url = $('server').value;
      socket = io(url + '/sanguosha', { transports: ['websocket'], query: { token } });
      socket.on('connect', () => { setConn('已连接'); $('tenantWrap').style.display = 'inline'; });
      socket.on('connect_error', (e) => { setConn('连接失败：' + e.message); });
      socket.on('sanguosha:update', (v) => render(v));
    }

    function emit(cmd, data) {
      return new Promise((resolve) => {
        socket.emit(cmd, data || {}, (res) => resolve(res || {}));
      });
    }

    // ---------- 大厅 ----------
    $('guestBtn').onclick = async () => {
      if (!(await guestLogin())) return;
      connect();
    };
    $('createAiBtn').onclick = async () => {
      const r = await emit('sanguosha:create', { mode: 'ai' });
      if (r.code === 0) { onEnter(r.data); } else alert(r.msg || '创建失败');
    };
    $('createNetBtn').onclick = async () => {
      const r = await emit('sanguosha:create', { mode: 'net' });
      if (r.code === 0) { onEnter(r.data); } else alert(r.msg || '创建失败');
    };
    $('joinBtn').onclick = async () => {
      const r = await emit('sanguosha:join', { tableId: $('joinId').value.trim() });
      if (r.code === 0) { onEnter(r.data); } else alert(r.msg || '加入失败');
    };
    $('startBtn').onclick = async () => {
      const r = await emit('sanguosha:start', { tableId: view.roomId });
      if (r.code === 0) render(r.data); else alert(r.msg || '开始失败');
    };
    $('leaveBtn').onclick = async () => {
      await emit('sanguosha:leave', { tableId: view.roomId });
      location.reload();
    };
    $('historyBtn').onclick = async () => {
      const r = await emit('sanguosha:history', {});
      const box = $('history');
      box.classList.toggle('hidden');
      box.innerHTML = (r.data || []).map((h) =>
        `<div class="ev">${h.createdAt || ''} · 桌${h.tableId} · 座位${h.seat} · ${idenText(h.identity)} · ${h.isWinner ? '胜' : '负'}</div>`
      ).join('') || '<div class="ev">暂无战绩</div>';
    };

    function onEnter(data) {
      view = data.view;
      $('lobby').classList.add('hidden');
      $('game').classList.remove('hidden');
      $('leaveBtn').classList.remove('hidden');
      $('myRoom').textContent = '房间号：' + view.roomId + '（座位 ' + (view.yourSeat + 1) + '）';
      render(view);
    }

    // ---------- 渲染 ----------
    function idenText(i) {
      return { lord: '主公', loyalist: '忠臣', rebel: '反贼', spy: '内奸' }[i] || i || '';
    }
    function isMyTurn() { return view.awaiting && view.awaiting.includes(view.yourSeat); }
    function myPlayer() { return view.players.find((p) => p.seat === view.yourSeat); }
    function needsTarget(card) {
      if (card.type === 'basic' && card.defId === 'sha') return true;
      if (card.trickKind === 'duel' || card.trickKind === 'dismantle' || card.trickKind === 'snatch') return true;
      if (card.isDelayedTrick) return true;
      return false;
    }

    function render(v) {
      view = v;
      if (v.winner) {
        const names = { lord: '主公方', loyalist: '忠臣方', rebel: '反贼方', spy: '内奸' };
        $('result').classList.remove('hidden');
        $('result').textContent = '对局结束：' + (names[v.winner] || v.winner) + ' 获胜';
      } else {
        $('result').classList.add('hidden');
      }
      $('turnInfo').textContent = '回合 ' + (v.round || 0) + ' · 阶段 ' + (v.phase || '') +
        ' · 当前：座位 ' + (v.turn + 1);

      // 座位
      const box = $('seats');
      box.innerHTML = '';
      v.players.forEach((p) => {
        const el = document.createElement('div');
        el.className = 'seat' + (p.isCurrentTurn ? ' current' : '') + (p.isAlive ? '' : ' dead');
        const iden = p.identity ? `<span class="iden ${p.identity}">${idenText(p.identity)}</span>` : '';
        const judge = (p.judge || []).map((c) => '【' + (c.name || '延时') + '】').join(' ');
        el.innerHTML = `
          <div class="name">${p.nickname || ('座位' + (p.seat + 1))}${p.isBot ? '🤖' : ''}</div>
          <div class="hero">${p.heroName || '未选将'}</div>
          <div class="meta"><span class="hp">❤ ${p.hp}/${p.maxHp}</span> · 手牌 ${p.handCount}</div>
          <div>${iden}</div>
          <div class="judge">${judge}</div>
          ${p.weapon ? '<div class="meta">武器：' + p.weapon + '</div>' : ''}
          ${p.armor ? '<div class="meta">防具：' + p.armor + '</div>' : ''}`;
        if (pendingTarget !== null && p.isAlive && p.seat !== view.yourSeat) {
          el.classList.add('clickable');
          el.onclick = () => chooseTarget(p.seat);
        }
        box.appendChild(el);
      });

      // 我的手牌
      const me = myPlayer();
      const handBox = $('hand');
      handBox.innerHTML = '';
      (me && me.hand ? me.hand : []).forEach((c) => {
        const el = document.createElement('div');
        el.className = 'card ' + (c.type === 'trick' ? 'trick' : c.type === 'equipment' ? 'equip' : '') +
          (selectedCards.includes(c.id) ? ' selected' : '');
        const s = SUIT_SYMBOL[c.suit] || '';
        el.innerHTML = `<div class="cn">${c.name}</div>
          <div class="suit" style="color:${SUIT_COLOR[c.suit] || '#222'}">${s}</div>
          <div class="num" style="color:${SUIT_COLOR[c.suit] || '#222'}">${c.number}</div>
          <div class="tag">${c.type === 'equipment' ? '装备' : c.type === 'trick' ? '锦囊' : '基本'}</div>`;
        el.onclick = () => toggleCard(c);
        handBox.appendChild(el);
      });

      $('playBtn').disabled = !(isMyTurn() && selectedCards.length > 0 && !v.pendingAsk);
      $('endBtn').disabled = !isMyTurn() || !!v.pendingAsk;
      renderSkills(me);
      renderRespond();
      renderLogs(v);
    }

    function renderLogs(v) {
      $('logs').innerHTML = (v.recentLogs || []).map((l) =>
        `<div class="ev">${l.text || ''}</div>`).join('');
    }

    function renderSkills(me) {
      const box = $('skillBtns');
      box.innerHTML = '';
      const skills = (me && me.heroId && HERO_SKILLS[me.heroId]) ? HERO_SKILLS[me.heroId] : [];
      skills.forEach((sk) => {
        const b = document.createElement('button');
        b.textContent = sk.label;
        b.title = sk.desc;
        b.disabled = !isMyTurn() || !!view.pendingAsk;
        b.onclick = () => useSkill(sk);
        box.appendChild(b);
      });
    }

    function renderRespond() {
      const box = $('respondBtns');
      box.innerHTML = '';
      const a = view.pendingAsk;
      if (!a || a.target !== view.yourSeat) { $('gameHint').textContent = ''; return; }
      if (a.kind === 'dodge') {
        $('gameHint').textContent = '【' + (a.desc || '出闪响应') + '】是否出闪？';
        box.appendChild(mkBtn('出闪', 'green', () => doRespond({ dodge: true })));
        box.appendChild(mkBtn('不出', '', () => doRespond({})));
      } else if (a.kind === 'wuxie') {
        $('gameHint').textContent = '【' + (a.desc || '无懈响应') + '】是否无懈可击？';
        box.appendChild(mkBtn('无懈', 'green', () => doRespond({ wuxie: true })));
        box.appendChild(mkBtn('不出', '', () => doRespond({})));
      }
    }
    function mkBtn(text, cls, fn) {
      const b = document.createElement('button');
      b.textContent = text; if (cls) b.className = cls; b.onclick = fn; return b;
    }

    // ---------- 操作 ----------
    function toggleCard(c) {
      if (view.pendingAsk) return;
      const i = selectedCards.indexOf(c.id);
      if (i >= 0) selectedCards.splice(i, 1); else if (selectedCards.length < 1) selectedCards.push(c.id);
      render(view);
    }

    function doRespond(extra) {
      emit('sanguosha:action', { tableId: view.roomId, action: Object.assign({ type: 'respond' }, extra) });
      $('respondBtns').innerHTML = '';
    }

    $('playBtn').onclick = () => {
      if (!selectedCards.length) return;
      const me = myPlayer();
      const card = me.hand.find((c) => c.id === selectedCards[0]);
      if (!card) return;
      if (needsTarget(card)) {
        pendingTarget = -1; // 进入选目标模式
        $('gameHint').textContent = '请选择目标座位（点击上方座位）';
        render(view);
      } else {
        emit('sanguosha:action', { tableId: view.roomId, action: { type: 'play', cardIds: selectedCards } });
        selectedCards = [];
      }
    };

    function chooseTarget(seat) {
      if (pendingTarget === null && !selectedCards.length) return;
      const me = myPlayer();
      const card = me.hand.find((c) => c.id === selectedCards[0]);
      emit('sanguosha:action', {
        tableId: view.roomId,
        action: { type: 'play', cardIds: selectedCards, target: seat },
      });
      selectedCards = [];
      pendingTarget = null;
      $('gameHint').textContent = '';
    }

    $('endBtn').onclick = () => {
      emit('sanguosha:action', { tableId: view.roomId, action: { type: 'end_turn' } });
    };

    function useSkill(sk) {
      if (sk.id === 'zhibeng' || sk.id === 'kurou' || sk.id === 'qingnang') {
        if (!selectedCards.length) { $('gameHint').textContent = sk.label + '：先选要弃置的手牌'; return; }
        emit('sanguosha:action', { tableId: view.roomId, action: { type: 'skill', skillId: sk.id, cardIds: selectedCards } });
        selectedCards = [];
      } else {
        emit('sanguosha:action', { tableId: view.roomId, action: { type: 'skill', skillId: sk.id } });
      }
    }

    // 已知武将技能（用于展示按钮）
    const HERO_SKILLS = {
      liubei: [{ id: 'rende', label: '仁德', desc: '给出手牌' }],
      caocao: [{ id: 'jianxiong', label: '奸雄(被动)', desc: '受伤获得造成伤害的牌' }],
      sunquan: [{ id: 'zhibeng', label: '制衡', desc: '弃牌并摸等量牌' }],
      guanyu: [{ id: 'wusheng', label: '武圣(被动)', desc: '红色手牌当杀' }],
      zhangfei: [{ id: 'paoxiao', label: '咆哮(被动)', desc: '出杀无次数限制' }],
      zhugeliang: [{ id: 'kongcheng', label: '空城(被动)', desc: '空手牌不可被【杀】指定' }],
      huatuo: [{ id: 'qingnang', label: '青囊', desc: '弃一张手牌，回复1体力' }],
      diaochan: [{ id: 'biyue', label: '闭月(被动)', desc: '结束阶段摸一张' }],
      zhaoyun: [{ id: 'longdan', label: '龙胆(被动)', desc: '杀当闪、闪当杀' }],
      huangyueying: [{ id: 'jiqi', label: '集智(被动)', desc: '用锦囊摸一张' }],
      zhenji: [
        { id: 'luoshen', label: '洛神(被动)', desc: '准备阶段翻黑牌入摸' },
        { id: 'qingguo', label: '倾国(被动)', desc: '黑牌当闪' },
      ],
      guojia: [{ id: 'yiji', label: '遗计(被动)', desc: '受伤后摸两张' }],
      zhangliao: [{ id: 'tuxi', label: '突袭(被动)', desc: '摸牌阶段从他人偷牌' }],
      lubu: [{ id: 'wushuang', label: '无双(被动)', desc: '杀/决斗需两张闪/杀响应' }],
      zhouyu: [{ id: 'yingzi', label: '英姿(被动)', desc: '摸牌阶段摸三张' }],
      simayi: [{ id: 'fankui', label: '反馈(被动)', desc: '受伤获得来源一张牌' }],
      machao: [{ id: 'mashu', label: '马术(被动)', desc: '攻击距离+1' }],
      huangzhong: [{ id: 'liegong', label: '烈弓(被动)', desc: '杀无视距离；目标手牌≤攻距则伤害+1' }],
      ganning: [{ id: 'qixi', label: '奇袭', desc: '弃黑色手牌当过河拆桥' }],
      huanggai: [{ id: 'kurou', label: '苦肉', desc: '弃一张牌，失去1点体力' }],
    };
  })();
  </script>
</body>
</html>
